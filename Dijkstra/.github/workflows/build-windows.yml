name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release

    - name: Build Executable
      run: |
        cd build
        nmake

    - name: Bundle Qt DLLs with windeployqt
      run: |
        mkdir dist
        copy build\dijkstra_visualizer.exe dist\
        windeployqt --no-compiler-runtime dist\dijkstra_visualizer.exe

    - name: Upload Downloadable Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DijkstraVisualizer-Windows
        path: dist/
